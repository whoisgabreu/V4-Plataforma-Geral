<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loader</title>

    <style>
        /* ===== LOADER ===== */
        .loader {
            position: fixed;
            inset: 0;
            background: #0000006b;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        .logo-loader {
            width: 60px;
            height: 60px;
            animation: float-old 0.5s ease-out infinite;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #ddd;
            border-top-color: #D61616;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            color: white;
        }

        @keyframes jump {
            0% {
                transform: translateY(0) scaleY(1);
                filter: drop-shadow(0 6px 3px rgba(214, 22, 22, 0.7));
            }

            20% {
                transform: translateY(0) scaleY(0.9);
            }

            40% {
                transform: translateY(-40px) scaleY(1);
                filter: drop-shadow(0 35px 12px rgba(214, 22, 22, 0.3));
            }

            70% {
                transform: translateY(0) scaleY(1.05);
                filter: drop-shadow(0 6px 3px rgba(214, 22, 22, 0.7));
            }

            100% {
                transform: translateY(0) scaleY(1);
            }
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
                filter: drop-shadow(0 8px 0px rgb(214, 22, 22));
            }

            25% {
                transform: translateY(-25px);
                filter: drop-shadow(0 20px 0px rgba(214, 22, 22, 0.4));
            }

            50% {
                transform: translateY(0);
                filter: drop-shadow(0 8px 0px rgb(214, 22, 22));
            }

            75% {
                transform: translateY(-12px);
                filter: drop-shadow(0 14px 0px rgb(214, 22, 22));
            }

            100% {
                transform: translateY(0);
                filter: drop-shadow(0 8px 0px rgba(214, 22, 22, 0.6));
            }
        }


        @keyframes float-old {
            0% {
                transform: translateY(0);
                filter: drop-shadow(0 6px 0px rgb(214, 22, 22));
            }

            25% {
                transform: translateY(-6px);
                filter: drop-shadow(0 6px 0px rgb(214, 22, 22));
            }

            50% {
                transform: translateY(-10px);
                filter: drop-shadow(0 0px 0px rgb(214, 22, 22));
            }

            75% {
                transform: translateY(-6px);
                filter: drop-shadow(0 -6px 0px rgb(214, 22, 22));
            }

            100% {
                transform: translateY(0);
                filter: drop-shadow(0 6px 0px rgb(214, 22, 22));
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0);
                filter: drop-shadow(0 8px 0 rgb(214, 22, 22));
            }

            20% {
                transform: translateY(-4px);
                filter: drop-shadow(0 6px 0 rgb(214, 22, 22));
            }

            40% {
                transform: translateY(-12px);
                filter: drop-shadow(0 2px 0 rgb(214, 22, 22));
            }

            /* pequeno overshoot (elasticidade) */
            55% {
                transform: translateY(-9px);
                filter: drop-shadow(0 0 0 rgb(214, 22, 22));
            }

            70% {
                transform: translateY(-5px);
                filter: drop-shadow(0 -2px 0 rgb(214, 22, 22));
            }

            85% {
                transform: translateY(2px);
                filter: drop-shadow(0 9px 0 rgb(214, 22, 22));
            }

            100% {
                transform: translateY(0);
                filter: drop-shadow(0 8px 0 rgb(214, 22, 22));
            }
        }


        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== CONTEÚDO EXEMPLO ===== */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .content {
            padding: 40px;
        }
    </style>
</head>
<body>

    <!-- LOADER -->
    
    <div class="loader">
        <img class="logo-loader" src="/static/images/V4LOGO.png" alt="Logo">
        <!-- <div class="spinner"></div> -->
        <p class="loader-text">Aguarde...</p>
    </div>

    <script>
        // // Remove o loader quando tudo terminar de carregar
        // window.addEventListener("load", () => {
        //     const loader = document.querySelector(".loader");
        //     loader.style.opacity = "0";

        //     setTimeout(() => {
        //         loader.style.display = "none";
        //     }, 400);
        // });

        const loader = document.querySelector(".loader");

        // Mostra o loader
        function showLoader() {
            loader.style.display = "flex";
            loader.style.opacity = "1";
        }

        // Esconde o loader quando tudo terminar de carregar
        window.addEventListener("load", () => {
            loader.style.opacity = "0";

            setTimeout(() => {
                loader.style.display = "none";
            }, 400);
        });

        // Mostra o loader antes de sair da página (links, reload, redirecionamentos)
        window.addEventListener("beforeunload", () => {
            showLoader();
        });

        // Intercepta cliques em links (<a>)
        document.addEventListener("click", (e) => {
            const link = e.target.closest("a");

            if (link && link.href) {
                showLoader();
            }
        });



    </script>

</body>
</html>
