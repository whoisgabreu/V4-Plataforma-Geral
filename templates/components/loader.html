<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loader</title>

    <style>
        /* ===== LOADER ===== */
        .loader {
            position: fixed;
            inset: 0;
            background: #0000007c;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #ddd;
            border-top-color: #D61616;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            color: white;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== CONTEÚDO EXEMPLO ===== */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .content {
            padding: 40px;
        }
    </style>
</head>
<body>

    <!-- LOADER -->
    <div class="loader">
        <div class="spinner"></div>
        <p class="loader-text">Aguarde...</p>
    </div>

    <script>
        // // Remove o loader quando tudo terminar de carregar
        // window.addEventListener("load", () => {
        //     const loader = document.querySelector(".loader");
        //     loader.style.opacity = "0";

        //     setTimeout(() => {
        //         loader.style.display = "none";
        //     }, 400);
        // });

        const loader = document.querySelector(".loader");

        // Mostra o loader
        function showLoader() {
            loader.style.display = "flex";
            loader.style.opacity = "1";
        }

        // Esconde o loader quando tudo terminar de carregar
        window.addEventListener("load", () => {
            loader.style.opacity = "0";

            setTimeout(() => {
                loader.style.display = "none";
            }, 400);
        });

        // Mostra o loader antes de sair da página (links, reload, redirecionamentos)
        window.addEventListener("beforeunload", () => {
            showLoader();
        });

        // Intercepta cliques em links (<a>)
        document.addEventListener("click", (e) => {
            const link = e.target.closest("a");

            if (link && link.href) {
                showLoader();
            }
        });



    </script>

</body>
</html>
